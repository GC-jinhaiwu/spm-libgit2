# OpenSSL Configure targets for the Apple slices built by script/spm.
# Each target builds a single architecture; script/spm/lib/openssl.sh merges
# the architectures of a slice with lipo afterwards.
my %targets = (
    "apple-ios-arm64" => {
        inherit_from => [ "ios64-xcrun" ],
        cflags       => add("-mios-version-min=13.0"),
    },
    "apple-ios-simulator-x86_64" => {
        inherit_from => [ "iossimulator-x86_64-xcrun" ],
        cflags       => add("-mios-simulator-version-min=13.0"),
    },
    "apple-ios-simulator-arm64" => {
        inherit_from => [ "iossimulator-arm64-xcrun" ],
        cflags       => add("-mios-simulator-version-min=13.0"),
    },
    "apple-maccatalyst-x86_64" => {
        inherit_from => [ "darwin64-x86_64-cc" ],
        cflags       => add("-mtargetos=ios13.1-macabi"),
    },
    "apple-maccatalyst-arm64" => {
        inherit_from => [ "darwin64-arm64-cc" ],
        cflags       => add("-mtargetos=ios13.1-macabi"),
    },
    "apple-macos-x86_64" => {
        inherit_from => [ "darwin64-x86_64-cc" ],
        cflags       => add("-mmacosx-version-min=10.15"),
    },
    "apple-macos-arm64" => {
        inherit_from => [ "darwin64-arm64-cc" ],
        cflags       => add("-mmacosx-version-min=10.15"),
    },
);
